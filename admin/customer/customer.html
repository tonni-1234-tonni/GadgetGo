<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Customers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        
        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .product {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin: 10px;
            width: 200px;
            text-align: center;
            background-color: #f9f9f9;
        }
        .add-to-cart {
            background-color: green;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
        }
        .add-to-cart:hover {
            background-color: darkgreen;
        }
        .cart {
            margin-top: 20px;
            border-top: 2px solid #000;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4>Admin Panel</h4>
        <a class="nav-link" href="/admin/admin_dashboard/dashboard.html">Dashboard</a>
        <a class="nav-link" href="/admin/order/order.html">Orders</a>
        <a class="nav-link" href="/admin/admin_product/product.html">Products</a>
        <a href="#">Customers</a>
        <a class="nav-link" href="/admin/settings/settings.html">Settings</a>
    </div>
    <h2>Welcome to Our E-Commerce Store</h2>
    <div class="product-container">
        <div class="product" data-id="1" data-name="Product 1" data-price="10">
            <h3>Product 1</h3>
            <p>Price: $10</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="product" data-id="2" data-name="Product 2" data-price="15">
            <h3>Product 2</h3>
            <p>Price: $15</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
        <div class="product" data-id="3" data-name="Product 3" data-price="20">
            <h3>Product 3</h3>
            <p>Price: $20</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </div>
    
    <div class="cart">
        <h2>Shopping Cart</h2>
        <ul id="cart-items"></ul>
        <p><strong>Total: $<span id="total-price">0</span></strong></p>
    </div>
    
    <script>
        $(document).ready(function() {
            var total = 0;
            $(".add-to-cart").click(function() {
                var product = $(this).closest(".product");
                var name = product.data("name");
                var price = product.data("price");
                
                $("#cart-items").append("<li>" + name + " - $" + price + "</li>");
                total += price;
                $("#total-price").text(total);
            });
        });
    </script>
</body>
</html>
