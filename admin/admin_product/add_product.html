<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            display: flex;
        }
        .sidebar {
            width: 250px;
            background: #111;
            color: white;
            height: 100vh;
            padding: 20px;
        }
        .sidebar a {
            color: white;
            display: block;
            padding: 10px;
            text-decoration: none;
        }
        .sidebar a:hover {
            background: #575757;
        }
        .main-content {
            flex-grow: 1;
            padding: 20px;
        }
        .create-product-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
        }
        .create-product-form input, .create-product-form select, .create-product-form button {
            margin-bottom: 10px;
        }
        .create-product-form .images {
            display: flex;
            gap: 10px;
        }
        .create-product-form .images img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }
        .create-product-form .tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .create-product-form .tags span {
            background: #e0e0e0;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h4>Admin Panel</h4>
        <a class="nav-link" href="/admin/admin_dashboard/dashboard.html">Dashboard</a>
        <a href="#">Orders</a>
        <a href="#">Products</a>
        <a href="#">Customers</a>
        <a href="#">Settings</a>
    </div>
    <div class="main-content">
        <h2>Add product</h2>
        <form class="create-product-form">
            <div class="mb-3">
                <label for="product-title" class="form-label">Product title</label>
                <input type="text" class="form-control" id="product-title" placeholder="Product title">
            </div>
            <div class="mb-3">
                <label for="product-label" class="form-label">Label</label>
                <input type="text" class="form-control" id="product-label" placeholder="Label">
            </div>
            <div class="mb-3">
                <label for="product-images" class="form-label">Images</label>
                <div class="images">
                    <img src="path/to/image1.jpg" alt="Image 1">
                    <img src="path/to/image2.jpg" alt="Image 2">
                    <img src="path/to/image3.jpg" alt="Image 3">
                    <button class="btn btn-secondary">Upload</button>
                </div>
            </div>
            <div class="mb-3">
                <label for="product-tags" class="form-label">Tags</label>
                <div class="tags">
                    <span>Clothes</span>
                    <span>Men</span>
                    <span>Fashion</span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="product-category" class="form-label">Category</label>
                    <select class="form-select" id="product-category">
                        <option value="select">Select</option>
                        <!-- Add more categories as needed -->
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="product-subcategory" class="form-label">Sub category</label>
                    <select class="form-select" id="product-subcategory">
                        <option value="select">Select</option>
                        <!-- Add more subcategories as needed -->
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="product-price" class="form-label">Price</label>
                    <input type="text" class="form-control" id="product-price" placeholder="Price">
                </div>
                <div class="col-md-6">
                    <label for="product-currency" class="form-label">Currency</label>
                    <select class="form-select" id="product-currency">
                        <option value="usd">USD</option>
                        <!-- Add more currencies as needed -->
                    </select>
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="publish-on-site">
                <label class="form-check-label" for="publish-on-site">Publish on site</label>
            </div>
            <button type="submit" class="btn btn-primary">Submit item</button>
        </form>
    </div>
</body>
</html>
